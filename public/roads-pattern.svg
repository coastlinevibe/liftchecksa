<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="roads" x="0" y="0" width="400" height="400" patternUnits="userSpaceOnUse">
      <!-- Horizontal roads -->
      <rect x="0" y="50" width="400" height="8" fill="#34d399" opacity="0.3"/>
      <rect x="0" y="150" width="400" height="8" fill="#34d399" opacity="0.3"/>
      <rect x="0" y="250" width="400" height="8" fill="#34d399" opacity="0.3"/>
      <rect x="0" y="350" width="400" height="8" fill="#34d399" opacity="0.3"/>
      
      <!-- Vertical roads -->
      <rect x="50" y="0" width="8" height="400" fill="#34d399" opacity="0.3"/>
      <rect x="150" y="0" width="8" height="400" fill="#34d399" opacity="0.3"/>
      <rect x="250" y="0" width="8" height="400" fill="#34d399" opacity="0.3"/>
      <rect x="350" y="0" width="8" height="400" fill="#34d399" opacity="0.3"/>
      
      <!-- Diagonal roads for variety -->
      <line x1="0" y1="0" x2="100" y2="100" stroke="#34d399" stroke-width="6" opacity="0.2"/>
      <line x1="300" y1="0" x2="400" y2="100" stroke="#34d399" stroke-width="6" opacity="0.2"/>
      <line x1="0" y1="300" x2="100" y2="400" stroke="#34d399" stroke-width="6" opacity="0.2"/>
      <line x1="300" y1="300" x2="400" y2="400" stroke="#34d399" stroke-width="6" opacity="0.2"/>
      
      <!-- Small blocks/buildings -->
      <rect x="20" y="20" width="20" height="20" fill="#10b981" opacity="0.15"/>
      <rect x="70" y="70" width="30" height="30" fill="#10b981" opacity="0.15"/>
      <rect x="170" y="20" width="25" height="25" fill="#10b981" opacity="0.15"/>
      <rect x="270" y="70" width="20" height="20" fill="#10b981" opacity="0.15"/>
      <rect x="320" y="170" width="30" height="30" fill="#10b981" opacity="0.15"/>
      <rect x="70" y="270" width="25" height="25" fill="#10b981" opacity="0.15"/>
      <rect x="220" y="220" width="20" height="20" fill="#10b981" opacity="0.15"/>
      <rect x="320" y="320" width="25" height="25" fill="#10b981" opacity="0.15"/>
    </pattern>
  </defs>
  
  <rect width="400" height="400" fill="url(#roads)"/>
</svg>
